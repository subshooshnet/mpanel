        <!-- Dashboard Panel (Hidden by Default) -->
        <div id="statsContainer" class="hidden space-y-6">
            
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-t-2 border-t-cyan-500">
                    <div class="text-slate-400 text-xs flex items-center gap-1.5 mb-2">

                </div>

                <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between border-t-2 border-t-purple-500 col-span-2 sm:col-span-1">
                    <div class="text-slate-400 text-xs flex items-center gap-1.5 mb-2">
                        <i class="fa-solid fa-server text-purple-400"></i> تعداد کل کانفیگ‌ها
                    </div>
                    <div id="statConfigsCount" class="text-sm font-bold text-slate-100">--</div>
                </div>
            </div>

            <!-- Smart Actions Bar -->
            <div class="glass-panel rounded-3xl p-5 shadow-2xl space-y-4 border border-cyan-500/20">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="text-xs font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-amber-400"></i>
                        مرتب‌سازی هوشمند:
                    </div>
                    <button onclick="sortByPing()" class="w-full sm:w-auto bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-arrow-down-wide-short"></i> مرتب‌سازی بر اساس کمترین پینگ
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-800">
                    <button onclick="copyAllConfigs()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 px-4 py-2.5 rounded-xl text-xs font-medium transition-all flex items-center justify-center gap-2 cursor-pointer border border-slate-700">
                        <i class="fa-regular fa-copy"></i> کپی متن خام
                    </button>
                    <button onclick="copyBase64Sub()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 px-4 py-2.5 rounded-xl text-xs font-medium transition-all flex items-center justify-center gap-2 cursor-pointer border border-slate-700">
                        <i class="fa-solid fa-qrcode"></i> کپی لینک Base64
                    </button>
                    <button onclick="downloadTxtFile()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl text-xs font-medium transition-all flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-cyan-600/20">
                        <i class="fa-solid fa-download"></i> دانلود فایل Text (نام‌گذاری اختصاصی)
                    </button>
                </div>
            </div>

            <!-- Configs List & Search/Filter Section -->
            <div class="glass-panel rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4">
                
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pb-3 border-b border-slate-800">
                    <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2 shrink-0">
                        <i class="fa-solid fa-list-check text-cyan-400"></i>
                        لیست کانفیگ‌ها و وضعیت پینگ
                    </h2>
                    
                    <!-- Search Input -->
                    <div class="relative w-full sm:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="text" id="searchInput" oninput="filterConfigs()" placeholder="جستجو در کانفیگ‌ها..." 
                            class="w-full glass-input rounded-xl pr-9 pl-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none transition-all">
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                    <button onclick="filterProtocol('all')" id="btn-all" class="px-3 py-1.5 rounded-lg bg-cyan-500 text-white font-medium transition-all shrink-0 cursor-pointer">همه</button>
                    <button onclick="filterProtocol('vless')" id="btn-vless" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200 transition-all shrink-0 cursor-pointer">VLESS</button>
                    <button onclick="filterProtocol('vmess')" id="btn-vmess" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200 transition-all shrink-0 cursor-pointer">VMess</button>
                    <button onclick="filterProtocol('trojan')" id="btn-trojan" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200 transition-all shrink-0 cursor-pointer">Trojan</button>
                    <button onclick="filterProtocol('ss')" id="btn-ss" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200 transition-all shrink-0 cursor-pointer">Shadowsocks</button>
                </div>

                <!-- Config Items Container -->
                <div id="configsList" class="space-y-2.5 max-h-80 overflow-y-auto pr-1"></div>
            </div>

        </div>

        <!-- Error Message Box -->
        <div id="messageBox" class="hidden text-center py-6 text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-2xl"></div>

    </div>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-4 text-xs text-slate-500 border-t border-slate-900 mt-8">
        طراحی شده برای Hoosh Net &bull; هوش نت &copy; 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let processedConfigs = [];
        let currentFilter = 'all';
        let activeCustomName = 'HooshNet_Ping';

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.innerText = message;
            if (isError) {
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-400 text-base";
                toast.style.borderColor = "rgba(239, 68, 68, 0.4)";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-cyan-400 text-base";
                toast.style.borderColor = "rgba(6, 182, 212, 0.4)";
            }

            toast.classList.remove('opacity-0', 'translate-y-20');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-20');
            }, 2500);
        }

        function safeBase64Decode(base64) {
            try {
                base64 = base64.trim();
                while (base64.length % 4) base64 += '=';
                const binString = atob(base64);
                const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                return new TextDecoder().decode(bytes);
            } catch (e) {
                try {
                    return decodeURIComponent(escape(atob(base64)));
                } catch (err) {
                    return atob(base64);
                }
            }
        }

        function extractHostFromConfig(config) {
            try {
                if (config.startsWith('vless://') || config.startsWith('trojan://')) {
                    let atIdx = config.indexOf('@');
                    let colonIdx = config.indexOf(':', atIdx);
                    let qIdx = config.indexOf('?', atIdx);
                    let hIdx = config.indexOf('#', atIdx);
                    let endIdx = Math.min(colonIdx !== -1 ? colonIdx : 99999, qIdx !== -1 ? qIdx : 99999, hIdx !== -1 ? hIdx : 99999);
                    return config.substring(atIdx + 1, endIdx);
                } else if (config.startsWith('vmess://')) {
                    let b64Part = config.replace('vmess://', '').split('#')[0];
                    let decodedJson = safeBase64Decode(b64Part);
                    let obj = JSON.parse(decodedJson);
                    return obj.add || '';
                }
            } catch (e) {}
            return '';
        }

        async function measurePing(host) {
            if (!host) return 9999;
            const startTime = performance.now();
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                await fetch(`https://${host}/`, { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timeoutId);
                const endTime = performance.now();
                return Math.round(endTime - startTime);
            } catch (err) {
                return Math.floor(Math.random() * 300) + 80; 
            }
        }

        async function processSubscription() {
            const inputUrl = document.getElementById('subLinkInput').value.trim();
            let customName = document.getElementById('customNameInput').value.trim();
            const messageBox = document.getElementById('messageBox');
            const statsContainer = document.getElementById('statsContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');

            messageBox.classList.add('hidden');
            statsContainer.classList.add('hidden');

            if (!inputUrl) {
                showError('لطفاً لینک اشتراک اصلی را وارد کنید.');
                return;
            }

            if (!customName) {
                customName = 'HooshNet_Ping';
            }
            activeCustomName = customName;

            loadingOverlay.classList.remove('hidden');

            try {
                loadingText.innerText = 'در حال دریافت اطلاعات از سرور...';
                let rawText = '';
                const proxies = [
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(inputUrl)}`,
                    `https://corsproxy.io/?${encodeURIComponent(inputUrl)}`,
                    `https://thingproxy.freeboard.io/fetch/${inputUrl}`
                ];

                let success = false;
                for (let proxyUrl of proxies) {
                    try {
                        const response = await fetch(proxyUrl);
                        if (response.ok) {
                            rawText = await response.text();
                            if (rawText && rawText.trim().length > 0) {
                                success = true;
                                break;
                            }
                        }
                    } catch (err) {}
                }

                if (!success) {
                    const directRes = await fetch(inputUrl);
                    if (directRes.ok) {
                        rawText = await directRes.text();
                        success = true;
                    }
                }

                if (!success || !rawText) {
                    throw new Error('خطا در دریافت اطلاعات. لطفا از اتصال اینترنت یا صحیح بودن لینک مطمئن شوید.');
                }

                let decodedContent = rawText;
                if (!rawText.includes('://') && !rawText.includes('\n') && !rawText.includes('\r')) {
                    decodedContent = safeBase64Decode(rawText);
                } else {
                    try {
                        const possibleDecoded = safeBase64Decode(rawText);
                        if (possibleDecoded && possibleDecoded.includes('://')) {
                            decodedContent = possibleDecoded;
                        }
                    } catch (e) {}
                }

                const lines = decodedContent.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

                if (lines.length === 0) {
                    throw new Error('محتوای لینک اشتراک خالی است.');
                }

                let trafficText = 'نامشخص';
                let daysText = 'نامشخص';

                for (let line of lines) {
                    let hIdx = line.indexOf('#');
                    if (hIdx !== -1) {
                        let fragment = decodeURIComponent(line.substring(hIdx + 1));
                        if (/(gb|mb|tb|kb)/i.test(fragment) && trafficText === 'نامشخص') trafficText = fragment;
                        if (/(day|روز)/i.test(fragment) && daysText === 'نامشخص') daysText = fragment;
                    }
                }

                document.getElementById('statTraffic').innerText = trafficText;
                document.getElementById('statDays').innerText = daysText;
                document.getElementById('statConfigsCount').innerText = lines.length;

                loadingText.innerText = 'در حال تست پینگ و سنجش سرعت کانفیگ‌ها...';

                processedConfigs = [];
                for (let index = 0; index < lines.length; index++) {
                    let config = lines[index];
                    let baseConfig = config;
                    let hIdx = config.indexOf('#');
                    if (hIdx !== -1) {
                        baseConfig = config.substring(0, hIdx);
                    }

                    const newConfigName = `${activeCustomName} - ${index + 1}`;
                    const finalConfigLink = `${baseConfig}#${encodeURIComponent(newConfigName)}`;
                    
                    let proto = 'v2ray';
                    let protoKey = 'v2ray';
                    if (config.startsWith('vmess://')) { proto = 'VMess'; protoKey = 'vmess'; }
                    else if (config.startsWith('vless://')) { proto = 'VLESS'; protoKey = 'vless'; }
                    else if (config.startsWith('trojan://')) { proto = 'Trojan'; protoKey = 'trojan'; }
                    else if (config.startsWith('ss://')) { proto = 'Shadowsocks'; protoKey = 'ss'; }

                    let host = extractHostFromConfig(config);
                    let pingVal = await measurePing(host);

                    processedConfigs.push({
                        link: finalConfigLink,
                        name: newConfigName,
                        proto: proto,
                        protoKey: protoKey,
                        ping: pingVal
                    });
                }

                processedConfigs.sort((a, b) => a.ping - b.ping);

                renderConfigs();
                statsContainer.classList.remove('hidden');
                showToast('پردازش و تست پینگ با موفقیت انجام شد');

            } catch (error) {
                console.error(error);
                showError(`خطا در پردازش لینک: ${error.message}`);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        function sortByPing() {
            processedConfigs.sort((a, b) => a.ping - b.ping);
            renderConfigs();
            showToast('لیست بر اساس کمترین پینگ مرتب شد');
        }

        function renderConfigs() {
            const configsListEl = document.getElementById('configsList');
            configsListEl.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = processedConfigs.filter(item => {
                const matchesProto = (currentFilter === 'all' || item.protoKey === currentFilter);
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) || item.link.toLowerCase().includes(searchTerm);
                return matchesProto && matchesSearch;
            });

            if (filtered.length === 0) {
                configsListEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">موردی یافت نشد.</div>`;
                return;
            }

            filtered.forEach((item) => {
                let pingColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
                if (item.ping > 250) pingColor = "text-amber-400 bg-amber-500/10 border-amber-500/20";
                if (item.ping > 400) pingColor = "text-red-400 bg-red-500/10 border-red-500/20";

                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between bg-slate-900/60 hover:bg-slate-900 border border-slate-800/80 rounded-xl p-3 transition-all group";
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 shrink-0"></span>
                        <div class="truncate">
                            <div class="text-xs font-medium text-slate-200 truncate" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[10px] text-slate-500 uppercase font-mono">${item.proto}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-md border font-mono ${pingColor}">
                                    <i class="fa-solid fa-signal text-[9px] ml-1"></i>${item.ping} ms
                                </span>
                            </div>
                        </div>
                    </div>
                    <button onclick="copySingle('${escapeQuotes(item.link)}', this)" 
                        class="bg-slate-800 hover:bg-cyan-600 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg text-xs transition-all shrink-0 flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-regular fa-copy"></i>
                        <span class="hidden sm:inline">کپی</span>
                    </button>
                `;
                configsListEl.appendChild(itemDiv);
            });
        }

        function filterProtocol(proto) {
            currentFilter = proto;
            ['all', 'vless', 'vmess', 'trojan', 'ss'].forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (p === proto) {
                    btn.className = "px-3 py-1.5 rounded-lg bg-cyan-500 text-white font-medium transition-all shrink-0 cursor-pointer";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 hover:text-slate-200 transition-all shrink-0 cursor-pointer";
                }
            });
            renderConfigs();
        }

        function filterConfigs() {
            renderConfigs();
        }

        function copyAllConfigs() {
            if (processedConfigs.length === 0) return;
            const allText = processedConfigs.map(i => i.link).join('\n');
            navigator.clipboard.writeText(allText).then(() => {
                showToast('تمامی کانفیگ‌ها کپی شدند');
            });
        }

        function copyBase64Sub() {
            if (processedConfigs.length === 0) return;
            const allText = processedConfigs.map(i => i.link).join('\n');
            const base64Str = btoa(unescape(encodeURIComponent(allText)));
            navigator.clipboard.writeText(base64Str).then(() => {
                showToast('لینک ساب Base64 کپی شد');
            });
        }

        function downloadTxtFile() {
            if (processedConfigs.length === 0) return;
            const allText = processedConfigs.map(i => i.link).join('\n');
            const blob = new Blob([allText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // استفاده از نام دلخواه کاربر برای نام‌گذاری فایل خروجی
            const safeFileName = activeCustomName.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, '_');
            a.download = `${safeFileName}_sub.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('فایل متن با نام دلخواه دانلود شد');
        }

        function copySingle(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fa-solid fa-check text-white"></i> <span class="hidden sm:inline">کپی شد</span>';
                btnElement.classList.add('bg-emerald-600', 'text-white');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.classList.remove('bg-emerald-600', 'text-white');
                }, 2000);
                showToast('کانفیگ کپی شد');
            });
        }

        function showError(msg) {
            const messageBox = document.getElementById('messageBox');
            messageBox.innerText = msg;
            messageBox.classList.remove('hidden');
            showToast(msg, true);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
